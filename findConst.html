<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmos - 내 별자리 찾기</title>
    <link rel="stylesheet" href="shared.css">
    <link rel="stylesheet" href="mainHome.css">
    <link rel="stylesheet" href="findConst.css">
</head>

<body>
    <canvas id="starCanvas"></canvas>

    <header>
        <nav>
            <div class="logo">
                <a href="mainHome.html">COSMOS</a>
            </div>
            <ul>
                <li><a href="mainHome.html">홈</a></li>
                <li><a href="findConst.html" class="active">별자리 찾기</a></li>
                <li><a href="match.html">운세 & 궁합</a></li>
                <li><a href="game.html">미니게임</a></li>
            </ul>
        </nav>
    </header>

    <main class="find-page-container">
        <section id="zodiac-finder">
            <h2>나의 탄생 별자리 찾기</h2>
            <p class="section-subtitle">당신이 태어난 날, 밤하늘을 수놓았던 별자리를 찾아보세요.</p>

            <div class="finder-box">
                <div class="input-group">
                    <label for="birth-date">생년월일 </label>
                    <input type="date" id="birth-date" min="1000-01-01" max="2099-12-31">
                </div>
                <button id="find-btn">별자리 분석하기</button>
            </div>

            <div id="finder-result" class="result-card hidden">
                <div class="result-header">
                    <span class="result-tag">당신의 별자리는</span>
                    <h3 id="result-name">물병자리</h3>
                    <span id="result-date" class="result-date-text">1.20 - 2.18</span>
                </div>
                <div class="result-body">
                    <img id="result-img" src="" alt="별자리 이미지" class="zodiac-img">
                    <p id="result-desc">별자리 설명이 이곳에 들어갑니다.</p>
                </div>
                <button id="close-result-btn">확인</button>
            </div>
        </section>

        <section id="all-zodiacs">
            <h2>12가지 별자리 한눈에 보기</h2>
            <p class="section-subtitle">밤하늘을 구성하는 12개의 신비로운 이야기들입니다.</p>

            <div class="card-container" id="gridCards"></div>
        </section>
    </main>

    <script src="mainHome.js"></script>
    <script src="findConst.js"></script>
</body>

</html>
